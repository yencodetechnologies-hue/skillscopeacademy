name: SkillScope Academy Backend CI/CD

on:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Deploy to VPS
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.SERVER_HOST }}
      username: root
      key: ${{ secrets.SSH_PRIVATE_KEY }}
      port: 22
      debug: true
      script: |
        set -e

        cd ~/skillscopeacademy/skillscopeacademy/backend

        echo "📥 Pulling latest code..."
        git pull origin main

        echo "⚙️ Loading Node.js 20..."
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        nvm use 20

        echo "📦 Installing dependencies..."
        npm install

        echo "🚀 Restarting application..."

        if pm2 describe skillscopeacademy >/dev/null 2>&1; then
          pm2 restart skillscopeacademy --update-env
        else
          pm2 start server.js --name skillscopeacademy
        fi

        pm2 save

        echo "✅ Deployment successful"
```
